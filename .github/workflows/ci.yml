name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-and-test-lints:
    name: Config and test lints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CI YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}", ".cirrus.yml"].each { |f| Gem::Version.new(Psych::VERSION) >= Gem::Version.new("4") ? YAML.load_file(f, aliases: true) : YAML.load_file(f); puts "valid YAML: #{f}" }'

      - name: Check test-suite naming
        run: python3 test/lint/lint-tests.py
