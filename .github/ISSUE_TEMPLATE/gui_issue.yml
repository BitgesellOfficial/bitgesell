name: Issue or feature request related to the GUI
description: Any report, issue or feature request related to the GUI
labels: [GUI]
body:
- type: checkboxes
  id: acknowledgement
  attributes:
    label: GUI reports are welcome here when they affect BGL-qt
    description: Please include screenshots or logs if they help explain the GUI behavior.
    options:
      - label: This issue is related to the BGL-qt GUI
        required: true
- type: textarea
  id: gui-request
  attributes:
    label: Report
  validations:
    required: true
